services:
  apple-music-web:
    build: .
    container_name: apple-music-web-beta
    ports:
      - "5000:5000"
    volumes:
      - music-download-data:/app/data
      - /media/Biblioteca/Media/Music:/app/downloads
      - /DATA/AppData/music-download/config:/app/apple-music-downloader
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
      - RATELIMIT_STORAGE_URL=redis://redis:6379
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    mem_limit: 2048m

  redis:
    image: redis:7-alpine
    container_name: apple-music-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  music-download-data:
