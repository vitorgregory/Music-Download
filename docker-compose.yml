version: "3.9"

services:
  music-download:
    # Use a imagem pública do GHCR ou uma tag local em build manual.
    image: ghcr.io/vitorgregory/music-download:latest
    container_name: music-download
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persistência do banco e credenciais da aplicação
      - ./data:/app/data
      # Pasta onde os downloads finais serão salvos
      - ./downloads:/app/downloads
      # Configuração do downloader Go (config.yaml e ajustes do processo externo)
      - ./config:/app/apple-music-downloader
    environment:
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"
      DISABLE_QUEUE_WORKER: "0"
      STALL_TIMEOUT_SECONDS: "300"
      MAX_RETRIES: "3"
      RETRY_BASE_SECONDS: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  data:
  downloads:
  config:
