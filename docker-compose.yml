services:
  music-download:
    image: ghcr.io/vitorgregory/music-download:latest
    platform: linux/amd64
    container_name: music-download
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /DATA/AppData/music-download/data:/app/data
      - /DATA/AppData/music-download/downloads:/app/downloads
      - /DATA/AppData/music-download/config:/app/config
      - /DATA/AppData/music-download/config/config.yaml:/app/apple-music-downloader/config.yaml
    environment:
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "0"
      DISABLE_QUEUE_WORKER: "0"
      WRAPPER_BIN: "/app/wrapper"
      WRAPPER_ROOTFS: "/app/rootfs"
      WRAPPER_CACHE_DIR: "/app/config/wrapper"
      STALL_TIMEOUT_SECONDS: "300"
      MAX_RETRIES: "3"
      RETRY_BASE_SECONDS: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    depends_on:
      wrapper-lite:
        condition: service_started

  wrapper-lite:
    build:
      context: https://github.com/WorldObservationLog/wrapper.git#lite
      dockerfile: Dockerfile
    image: music-download-wrapper-lite:latest
    container_name: music-download-wrapper-lite
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /DATA/AppData/music-download/wrapper-lite:/app/rootfs/data
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
